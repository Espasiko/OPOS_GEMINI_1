# Minimal example YAML for CPU LoRA fine-tuning using mistral-finetune
# Edit the paths below to match your environment before running.
#
# ALTERNATIVA RÁPIDA (sin fine-tuning):
# Si solo quieres inferencia local inmediata, usa GGUF pre-cuantizado:
#   1. wget https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF/resolve/main/mistral-7b-instruct-v0.2.Q4_K_M.gguf -O ~/mistral_models/mistral-7b-instruct-q4.gguf
#   2. pip install llama-cpp-python
#   3. python backend/agents/mistral_gguf_local.py
#
# Este archivo YAML es SOLO para entrenar LoRA desde cero (lento en CPU).

model_id_or_path: "/home/espasiko/mistral_models/7B"  # path to downloaded base model
run_dir: "/home/espasiko/mistral_runs/7B_cpu_lora"

data:
  instruct_data: "/home/espasiko/data/train.jsonl"
  eval_instruct_data: "/home/espasiko/data/eval.jsonl"

max_steps: 300
seq_len: 512
batch_size: 1
device: cpu

lora:
  rank: 8
  alpha: 32
  save_adapters: True

optim:
  lr: 1e-4
  weight_decay: 0.0

save_every: 100
ckpt_freq: 100
log_freq: 10
