# OpositAIA Agent System
# Versión inicial INSPIRADA en BMAD Method , pero NO ES BMAD

# Configuración global
config:
  project: "OpositAIA"
  version: "1.0.0"
  
  # Modelos disponibles (Actualizado Marzo 2026)
  models:
    local_finetuned:
      name: "salamandra"
      type: "vps"
      
    cloud_fast:
      name: "groq-70b" # Llama 3.3 Versatile
      provider: "groq"
      
    cloud_reasoning:
      name: "deepseek-reasoner" # DeepSeek R1 (Thinking / V3.2 internals)
      provider: "deepseek"

    cloud_expert:
      name: "claude-3-5-sonnet" # Golden standard legal
      provider: "anthropic"
      
    mistral_large:
      name: "mistral-large" # Prioridad Europea / Gratis Tier
      provider: "mistral"
  
  # RAG
  rag:
    qdrant_url: "http://localhost:6333"
    collection: "opositaia_knowledge_FULL_XML"
    embedding_model: "pablosi/bge-m3-spa-law-qa-trained-2"
  
  # Anti-bias
  anti_bias_prompt: |
    IMPORTANTE: La respuesta correcta puede ser A, B, C o D con IGUAL probabilidad.
    NO asumas que ninguna posición es más probable que otra.
    Analiza CADA opción de forma INDEPENDIENTE antes de elegir.
