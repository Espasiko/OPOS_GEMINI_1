version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: opositaia-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    # restart: unless-stopped
    networks:
      - opositaia-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      disable: true

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: opositaia-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=opositaia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - opositaia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3


  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opositaia-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.backend
    environment:
      # PostgreSQL (local en Docker)
      - POSTGRES_HOST=opositaia-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=opositaia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      
      # Qdrant (local en Docker)
      - QDRANT_HOST=opositaia-qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://opositaia-qdrant:6333
      - QDRANT_COLLECTION_NAME=opositaia_knowledge
      
      # Ollama (en WSL, accesible desde Docker Desktop vía host.docker.internal)
      - OLLAMA_URL=http://host.docker.internal:11434
      
      # FastAPI
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped
    networks:
      - opositaia-network
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  opositaia-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  postgres_data:
    driver: local

